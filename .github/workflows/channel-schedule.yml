name: "Канал: рубрики за розкладом"

on:
  schedule:
    - cron: '0 17 * * *'   # 19:00 за Києвом взимку; що публікувати — у content/channel_schedule.json
  workflow_dispatch:
    inputs:
      dry:
        description: 'Лише показати, що вийшло б зараз'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: channel-schedule
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опублікувати
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then
            python -X utf8 channel_schedule.py --dry
            exit 0
          fi
          python -X utf8 channel_schedule.py
      - name: Запам'ятати опубліковане
        if: ${{ always() && inputs.dry != true }}
        run: |
          git config user.name "CooLaw"
          git config user.email "coolaw@users.noreply.github.com"
          git add content/channel_schedule_done.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: опубліковано рубрику в каналі [skip ci]" && git pull --rebase && git push)
